<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machay-online</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1a2233;--mu:#667;--bl:#1e6fff;--bd:#dde3ef}
@media(prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1b2130;--tx:#eef1f8;--mu:#9aa4b8;--bd:#2c3448}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Arial,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:10px 14px;z-index:5}header h1{font-size:18px;margin:0;flex:1}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer}
.blue{background:var(--bl);border-color:var(--bl);color:#fff;font-weight:600}
main{max-width:900px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.sv{text-align:center;font-weight:600;cursor:pointer}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}.mu{color:var(--mu)}video{width:100%;max-width:300px;border-radius:12px;background:#000}
.pic{width:100%;max-height:260px;object-fit:cover;border-radius:12px}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;white-space:nowrap}
#bn{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#bn button{flex:1;border:0;background:none;color:var(--mu);font-size:12px}#bn button.on{color:var(--bl);font-weight:700}#bn b{display:block;font-size:22px}
#mo{display:none;position:fixed;inset:0;background:#0009;z-index:9;overflow:auto;padding:20px}
</style></head><body>
<header><h1>Machay-online</h1><button id="out" style="display:none">Chiqish</button></header>
<main id="v"></main><nav id="bn" style="display:none"></nav>
<div id="mo"><div class="card" id="mi" style="max-width:480px;margin:auto"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,doc,setDoc,updateDoc,deleteDoc,collection,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const ADMIN_EMAIL="ADMIN_EMAIL_SHU_YERGA"; // <-- o'zingizning emailingiz (firestore.rules da ham shu)
const app=initializeApp({apiKey:"AIzaSyBAtQ80U94szI_BKsG-KoUYfkldK6j3_j4",authDomain:"machay-online.firebaseapp.com",projectId:"machay-online",storageBucket:"machay-online.firebasestorage.app",messagingSenderId:"510918671531",appId:"1:510918671531:web:30150d44139d61c6114bee"});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>Number(n).toLocaleString();
const BASE=['Kiyim-kechak','Oziq-ovqat','Kitoblar','Notebook','Telefon','Avtomobil','Qoramollar','Mevalar','Un mahsulotlari','Yem'],IC=['👕','🍞','📚','💻','📱','🚗','🐄','🍎','🌾','🌿'];
const CARD={num:'5614 6822 1648 8777',holder:'Jumayev Muhriddin'};
let uid,me=null,isAdmin=false,page='buy',cats=[],lst=[],users=[],shopCat=null,sc=null,video=null,mode='in',unsub=[],al=[],amt=0;
const ico=n=>IC[BASE.indexOf(n)]||'📦',allCats=()=>BASE.concat(cats.map(c=>c.name));
const modal=h=>{$('#mi').innerHTML=h;$('#mo').style.display='block'},closeM=()=>$('#mo').style.display='none';
$('#mo').onclick=e=>{if(e.target.id==='mo')closeM()};window.closeM=closeM;
function toJpg(f,mx,q){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.onerror=no;im.src=u})}
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{unsub.forEach(f=>f());unsub=[];if(!u){uid=null;me=null;$('#out').style.display=$('#bn').style.display='none';return authView()}
 uid=u.uid;isAdmin=u.email===ADMIN_EMAIL;$('#out').style.display='';
 unsub.push(onSnapshot(doc(db,'users',uid),s=>{me=s.exists()?s.data():null;render()},e=>console.log(e)));
 if(isAdmin||true)unsub.push(onSnapshot(collection(db,'cats'),s=>{cats=s.docs.map(d=>d.data());render()},()=>{}));
 unsub.push(onSnapshot(isAdmin?collection(db,'listings'):query(collection(db,'listings'),where('status','==','ok')),s=>{lst=s.docs.map(d=>({...d.data(),_id:d.id}));render()},()=>{}));
 if(isAdmin)unsub.push(onSnapshot(collection(db,'users'),s=>{users=s.docs.map(d=>({...d.data(),_id:d.id}));render()}))});
const ok=()=>isAdmin||me?.approved;
function authView(){$('#bn').style.display='none';$('#v').innerHTML=`<div class="card"><button class="${mode==='in'?'blue':''}" onclick="setMode('in')">Kirish</button> <button class="${mode==='up'?'blue':''}" onclick="setMode('up')">Ro'yxatdan o'tish</button><br><br>
 ${mode==='up'?`<label>Ism</label><input id="i1"><label>Familiya</label><input id="i2"><label>Sharifi</label><input id="i3"><label>Telefon raqami</label><input id="i4" type="tel" placeholder="+998"><label>Tug'ilgan sana</label><input id="i5" type="date"><label>Face ID video (3 soniya)</label><br><video id="pv" autoplay muted playsinline></video><br><button onclick="rec()">🎥 Videoni yozish</button> <span id="rs" class="mu"></span><br><br>`:''}
 <label>Email</label><input id="em" type="email"><label>Parol (kamida 6 belgi)</label><input id="pw" type="password"><button class="blue" onclick="${mode==='in'?'login()':'reg()'}">${mode==='in'?'Kirish':"Ro'yxatdan o'tish"}</button> <span id="er" style="color:#d33"></span></div>`}
window.setMode=m=>{mode=m;authView()};
window.rec=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:240,height:240}});const pv=$('#pv');pv.srcObject=s;const ch=[],r=new MediaRecorder(s,{videoBitsPerSecond:80000});r.ondataavailable=e=>ch.push(e.data);r.onstop=()=>{s.getTracks().forEach(t=>t.stop());const f=new FileReader();f.onload=()=>{video=f.result;$('#rs').textContent='✅ Video tayyor';pv.srcObject=null;pv.src=video;pv.controls=true;pv.muted=false};f.readAsDataURL(new Blob(ch,{type:r.mimeType}))};r.start();$('#rs').textContent='Yozilmoqda...';setTimeout(()=>r.stop(),3000)}catch(e){$('#rs').textContent='Kameraga ruxsat berilmadi'}};
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(e){$('#er').textContent='Email yoki parol noto\'g\'ri'}};
window.reg=async()=>{const d={ism:$('#i1').value.trim(),fam:$('#i2').value.trim(),sharif:$('#i3').value.trim(),tel:$('#i4').value.trim(),dob:$('#i5').value};
 if(Object.values(d).some(x=>!x)||!video)return($('#er').textContent="Barcha maydonlarni to'ldiring va videoni yozing");
 try{const c=await createUserWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value);await setDoc(doc(db,'users',c.user.uid),{...d,email:c.user.email,face:video,approved:false,t:Date.now()})}catch(e){$('#er').textContent=e.code}};
function render(){if(!uid)return;const n=$('#bn');n.style.display='flex';
 n.innerHTML=[['buy','🛍',"Sotib oling"],['sell','➕','Soting'],['acc','👤',isAdmin?'Admin':'Akaunt']].map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');
 const v=$('#v');if(!ok()&&page!=='acc'){page='acc'}({buy,sell,acc})[page](v)}
window.go=p=>{page=p;sc=null;shopCat=null;render()};
const ads=()=>lst.filter(a=>a.status==='ok'&&a.exp>Date.now()).sort((a,b)=>b.t-a.t);
const tiles=(fn,cnt)=>(isAdmin?'<div class="card"><button class="blue" onclick="addCat()">➕ Bo\'lim qo\'shish</button></div>':'')+'<div class="grid">'+allCats().map((n,i)=>`<div class="card sv" onclick="${fn}(${i})"><div style="font-size:34px">${ico(n)}</div>${esc(n)}${cnt?`<div class="mu" style="font-weight:400">${ads().filter(a=>a.cat===n).length} ta e'lon</div>`:''}</div>`).join('')+'</div>';
window.addCat=async()=>{const n=prompt("Yangi bo'lim nomi:");if(n&&n.trim())await setDoc(doc(collection(db,'cats')),{name:n.trim()})};
window.pickBuy=i=>{shopCat=i;render()};window.pickSell=i=>{sc=i;amt=30000+1+Math.floor(Math.random()*999);render()};
function buy(v){if(shopCat===null){v.innerHTML='<h3>🛍 Sotib oling</h3>'+tiles('pickBuy',true);return}
 const n=allCats()[shopCat];al=ads().filter(a=>a.cat===n);
 v.innerHTML=`<button onclick="shopCat=null;render()">← Bo'limlar</button><h3>${ico(n)} ${esc(n)}</h3><div class="grid">${al.map((a,i)=>`<div class="card" style="cursor:pointer" onclick="openAd(${i})"><img class="pic" style="height:130px" src="${a.img}"><p style="margin:8px 0 4px">${esc(a.desc.slice(0,70))}</p><b style="color:var(--bl)">📞 ${esc(a.tel)}</b></div>`).join('')||'<div class="card mu">Bu bo\'limda hozircha e\'lon yo\'q</div>'}</div>`}
window.openAd=i=>{const a=al[i];modal(`<img class="pic" src="${a.img}"><p>${esc(a.desc)}</p><h3 style="color:var(--bl)">📞 ${esc(a.tel)}</h3><a class="btn blue" href="tel:${esc(a.tel)}" style="text-decoration:none">Qo'ng'iroq qilish</a> <button onclick="closeM()">Yopish</button>${isAdmin?` <button onclick="delAd('${a._id}')">🗑</button>`:''}`)};
window.delAd=async id=>{if(confirm("O'chirilsinmi?")){await deleteDoc(doc(db,'listings',id));closeM()}};
function sell(v){if(sc===null){v.innerHTML='<h3>🏷 Soting</h3><p class="mu">Mahsulot turini tanlang:</p>'+tiles('pickSell',false);return}
 const n=allCats()[sc];
 v.innerHTML=`<button onclick="sc=null;render()">← Bo'limlar</button><h3>${ico(n)} ${esc(n)} — e'lon joylash</h3><div class="card"><label>Mahsulot rasmi</label><input id="ar" type="file" accept="image/*"><label>Izoh</label><textarea id="ad2" rows="3"></textarea><label>Telefon raqam</label><input id="at" type="tel" value="${esc(me?.tel||'')}"></div>
 <div class="card" style="border-color:var(--bl)"><b>💳 To'lov qiling</b><div style="font-size:22px;margin:6px 0">${CARD.num}</div><div class="mu">${CARD.holder}</div><p>Oylik reklama: 30 000 so'm. Kartaga aynan <b style="color:var(--bl)">${fmt(amt)} so'm</b> o'tkazing (oxirgi raqamlar to'lovni aniqlash uchun). Admin to'lovni tasdiqlagach e'lon "Sotib oling" bo'limiga chiqadi.</p><button class="blue" id="ap">✅ To'lov qildim</button> <span id="as" class="mu"></span></div>`;
 $('#ap').onclick=async()=>{const f=$('#ar').files[0],d=$('#ad2').value.trim(),t=$('#at').value.trim();if(!f||!d||!t)return alert('Rasm, izoh va telefonni kiriting');$('#as').textContent='Yuklanmoqda...';
  try{const now=Date.now();await setDoc(doc(collection(db,'listings')),{uid,name:`${me?.fam||''} ${me?.ism||''}`,cat:n,img:await toJpg(f,600,.6),desc:d,tel:t,t:now,exp:now+30*864e5,status:'wait',amt});sc=null;render();modal("<h3>⏳ To'lovingiz tekshirilmoqda</h3><p>Admin tasdiqlagach e'loningiz «Sotib oling» bo'limiga qo'shiladi.</p><button class='blue' onclick='closeM()'>Yaxshi</button>")}catch(e){$('#as').textContent='Xatolik: '+e.code}}}
function acc(v){
 if(!isAdmin){v.innerHTML=`<div class="card"><h3>Mening akauntim</h3>${me?`<p>${esc(me.fam)} ${esc(me.ism)} ${esc(me.sharif)}<br>📞 ${esc(me.tel)}<br>🎂 ${esc(me.dob)}</p><span style="font-weight:600">${me.approved?'✅ Admin tasdiqladi':"⏳ Admin tasdig'i kutilmoqda"}</span>`:'Yuklanmoqda...'}</div>`;return}
 const w=lst.filter(a=>a.status==='wait'),o=lst.filter(a=>a.status==='ok');
 v.innerHTML=`<div class="card"><h3>📊 Hisobot</h3>Foydalanuvchilar: <b>${users.length}</b> · Faol e'lonlar: <b>${o.length}</b> · Tushum: <b>${fmt(o.length*30000)} so'm</b></div>
 <div class="card"><h3>⏳ Kutilayotgan to'lovlar (${w.length})</h3>${w.map(a=>`<div style="margin:6px 0">${esc(a.name)} · ${esc(a.cat)} · <b>${fmt(a.amt)}</b> so'm <button class="blue" onclick="okAd('${a._id}')">Tasdiqlash</button> <button onclick="delAd('${a._id}')">🗑</button></div>`).join('')||'<span class="mu">Yo\'q</span>'}</div>
 <div class="card"><h3>👥 Foydalanuvchilar</h3><div class="tw"><table><tr><th>Ism</th><th>Telefon</th><th>Tug'ilgan</th><th>Face ID</th><th>Holat</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.fam)} ${esc(u.ism)} ${esc(u.sharif)}</td><td>${esc(u.tel)}</td><td>${esc(u.dob)}</td><td>${u.face?`<video controls src="${u.face}" style="width:90px"></video>`:''}</td><td>${u.approved?'✅':'⏳'}</td><td><button class="blue" onclick="appr('${u._id}',${!u.approved})">${u.approved?'Bekor':'Tasdiqlash'}</button></td></tr>`).join('')}</table></div></div>`}
window.appr=(id,b)=>updateDoc(doc(db,'users',id),{approved:b});window.okAd=id=>updateDoc(doc(db,'listings',id),{status:'ok'});
</script></body></html>
